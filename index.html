<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wordwright: coming soon</title>
    <meta
      name="description"
      content="Wordwright helps writers find ideas, shape arguments and judge their own drafts, without losing their voice. Coming soon."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Ember palette, copied from apps/web/src/theme/palette-ember.css (light, then dark by system setting). */
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('/fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --paper: #f8f5f1;
        --ink: #2a2420;
        --ink-soft: #594f47;
        --line: #e0d8ce;
        --accent: #b0440c;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1a1512;
          --ink: #f1e9e1;
          --ink-soft: #b8aa9d;
          --line: #382e27;
          --accent: #f08a4b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem 1rem;
        background: var(--paper);
        color: var(--ink);
        font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .mark {
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 2.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        min-width: 8rem;
        font-size: 1.125rem;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="mark"
        aria-hidden="true"
        focusable="false"

        height="96"

        />
      </svg>
      <h1>Wordwright</h1>
      <p>Coming soon</p>
    </main>
  </body>
</html>
