<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Slate · Aubergine</title>
    <link rel="stylesheet" href="./theme.css" />
    <script>
      ;(function () {
        var q = new URLSearchParams(location.search).get('theme'),
          s
        try {
          s = localStorage.getItem('lfwa-theme')
        } catch (e) {}
        var t = q || s
        if (t) document.documentElement.setAttribute('data-theme', t)
        document.addEventListener('DOMContentLoaded', function () {
          var b = document.getElementById('theme-toggle')
          if (!b) return
          function dark() {
            var d = document.documentElement.getAttribute('data-theme')
            return d ? d === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          }
          function sync() {
            b.setAttribute('aria-pressed', String(dark()))
            b.querySelector('span').textContent = dark() ? 'Dark' : 'Light'
            b.querySelector('use').setAttribute('href', dark() ? '#i-moon' : '#i-sun')
          }
          b.addEventListener('click', function () {
            var n = dark() ? 'light' : 'dark'
            document.documentElement.setAttribute('data-theme', n)
            try {
              localStorage.setItem('lfwa-theme', n)
            } catch (e) {}
            sync()
          })
          sync()
        })
      })()
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
        </symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24">
          <path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16l-1 4z" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
        <symbol id="i-rss" viewBox="0 0 24 24">
          <path d="M5 19.01V19M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14" />
        </symbol>
        <symbol id="i-grip" viewBox="0 0 24 24">
          <path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3.2" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5M12 8h.01" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="M12 4l9 16H3z" />
          <path d="M12 10v4M12 17h.01" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"
          />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"
          />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" />
          <path d="M5 17a3 3 0 0 1 3-3h11" />
        </symbol>
        <symbol id="i-bulb" viewBox="0 0 24 24">
          <path
            d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"
          />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4" />
        </symbol>
        <symbol id="i-quote" viewBox="0 0 24 24">
          <path d="M5 8h5v5H5zM14 8h5v5h-5zM5 13c0 3 1 4 3 5M14 13c0 3 1 4 3 5" />
        </symbol>
      </defs>
    </svg>
    <a
      href="#main"
      class="sr-only z-50 bg-surface px-4 py-2 font-semibold text-ink focus:not-sr-only focus:absolute focus:left-2 focus:top-2"
      >Skip to content</a
    >
    <main id="main" class="grid min-h-screen place-items-center px-4 py-12">
      <div class="w-full">
        <p class="mb-6 text-center font-semibold">Wordwright</p>
        <section class="panel mx-auto max-w-sm p-6 sm:p-8" aria-labelledby="si-h">
          <h1 id="si-h" class="h1 mb-5 !text-3xl">Sign in</h1>
          <form class="space-y-4">
            <div>
              <label class="label" for="email">Email</label
              ><input
                id="email"
                class="field"
                type="email"
                autocomplete="email"
                value="maya@example.org"
              />
            </div>
            <div>
              <label class="label" for="pw">Password</label
              ><input id="pw" class="field" type="password" autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign in</button>
          </form>
          <p class="mt-3 text-center"><a href="#" class="link">Forgot your password?</a></p>
          <p class="meta my-5 text-center" aria-hidden="true">or</p>
          <button type="button" class="btn btn-neutral w-full gap-3">
            <span class="source-letter mark-sm !bg-white !text-[#1f1f1f]" aria-hidden="true"
              >G</span
            >
            Continue with Google
          </button>
          <p class="mt-6 text-center">New here? <a href="#" class="link">Create an account</a></p>
        </section>
      </div>
    </main>
  </body>
</html>
