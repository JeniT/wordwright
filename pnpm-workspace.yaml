packages:
  - apps/*
  - packages/*
  - prompts
  - evals
minimumReleaseAgeExclude:
  - vite@8.3.4
allowBuilds:
  esbuild: true
  vue-demi: false
  msw: false
# Accepted on purpose, see "Accepted advisory" in docs/dependencies.md: no patched picomatch exists and it is only in build tooling.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
# Patched glob and minimatch exist but their parents (js-beautify, editorconfig, typescript-estree) pin older majors;
# see "Forced versions" in docs/dependencies.md.
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1
