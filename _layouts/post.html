---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="byline">
    By {{ site.author.name }} · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
  </p>
  {{ content }}
</article>
<p class="back"><a href="/blog/">All posts</a></p>
