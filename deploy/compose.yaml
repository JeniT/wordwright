# Production on one machine. Run from this folder, with the settings in `.env` beside this file (copy
# `production.env.example`); see docs/deploy.md. There must be exactly ONE api container: the rate limiter lives in its
# memory and the database is one SQLite file.
name: wordwright

services:
  api:
    image: ${WORDWRIGHT_IMAGE_API:-ghcr.io/jenit/wordwright-api}:${WORDWRIGHT_TAG:-latest}
    build:
      context: ..
      target: api
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logs # A small disk: cap the logs instead of letting them fill it.
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  web:
    image: ${WORDWRIGHT_IMAGE_WEB:-ghcr.io/jenit/wordwright-web}:${WORDWRIGHT_TAG:-latest}
    build:
      context: ..
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Only the address: the secrets in `.env` are for the api alone.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logs

volumes:
  data:
  caddy-data:
  caddy-config:
